name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  # go.mod référence core par `replace => ../core` (core n'est pas encore publié
  # comme module versionné) : core est donc récupéré à côté de ce repo.
  # Une fois core tagué, supprimer le `replace` de go.mod, cette variable, le
  # checkout de core ci-dessous et `--build-arg` dans l'étape de build.
  CORE_REF: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: essence-back
      - uses: actions/checkout@v4
        with:
          repository: OpenHexa-fr/core
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: essence-back/go.mod
          cache-dependency-path: essence-back/go.sum
      - name: Format
        working-directory: essence-back
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: essence-back
        run: go vet ./...
      - name: Tests
        working-directory: essence-back
        run: go test -race ./...

  deploy:
    # Le déploiement ne part que si la suite passe : sans cette dépendance, les
    # tests tourneraient en parallèle de la mise en production qu'ils sont
    # censés protéger.
    needs: test
    # Les tests tournent sur les PR, le déploiement non : le credential fédéré
    # OIDC n'est de toute façon accordé qu'à `refs/heads/main`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image via ACR
        run: |
          az acr build --registry acropenhexa \
            --image essence-back:${{ github.sha }} \
            --build-arg CORE_REF=${{ env.CORE_REF }} \
            --file Dockerfile.deploy .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-essence-back \
            --resource-group rg-openhexa \
            --image acropenhexa.azurecr.io/essence-back:${{ github.sha }}
